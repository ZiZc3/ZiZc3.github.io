<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEEPSLOP 13.60 Test</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080c14;
      color: #e5e7eb;
      font: 16px system-ui, sans-serif;
    }
    main {
      width: min(520px, calc(100% - 40px));
      padding: 28px;
      border: 1px solid #263449;
      border-radius: 10px;
      background: #0f172a;
      text-align: center;
    }
    p { color: #94a3b8; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <h1>DEEPSLOP · PS5 13.60</h1>
    <p>
      This is the separate DEEPSLOP test path. It does not load
      <code>slopkit_ref</code> and does not use this project's experimental
      <code>offsets/13.60.js</code>.
    </p>
    <a href="https://badrcoderman.github.io/deepslop/">Open DEEPSLOP</a>
  </main>
